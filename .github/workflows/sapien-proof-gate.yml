name: Sapien Research Forge Proof Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate research metadata and analytic identity
        run: python sapien-research-forge/scripts/validate.py

      - name: Check reversible human-machine provenance seal
        run: python sapien-research-forge/scripts/verify_seal.py

      - name: Check T16 X10 bootstrap constants and T17 nonresonance
        run: python sapien-research-forge/scripts/check_t16_t17.py

      - name: Check T18 ball inclusion margins and sampling
        run: python sapien-research-forge/scripts/check_t18.py
